name: refresh katalog gempa

on:
  schedule:
    - cron: "11 * * * *"   # tiap jam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Ambil katalog BMKG dan tulis ulang laporan
        run: python -m gempa_indonesia.cli
      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs README.md
          git diff --cached --quiet || git commit -m "chore: refresh katalog gempa BMKG"
          git push
